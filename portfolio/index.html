<style>:root {
  --bg: #0b0816;
  --bg2: #110c22;
  --surface: #151029;
  --surface2: #1b1534;
  --line: rgba(var(--tint), 0.1);
  --line2: rgba(var(--tint), 0.2);
  --text: #f5f3ff;
  --muted: #a7a1bd;
  --dim: #6f6888;
  --violet: #8b5cf6;
  --violet-deep: #5b21b6;
  --lilac: #ddd6fe;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 18px;
  --tint: 221, 214, 254;
  --bg-rgb: 11, 8, 22;
  --bg2-rgb: 17, 12, 34;
  --surface-rgb: 21, 16, 41;
  --contact-a: #1d1440;
  --contact-b: #0f0a20;
  --shadow: rgba(0, 0, 0, .8);
  --backdrop: rgba(6, 4, 14, .7);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f5fc;
  --bg2: #efebf8;
  --surface: #ffffff;
  --surface2: #f4f0fc;
  --line: rgba(46, 16, 101, 0.1);
  --line2: rgba(46, 16, 101, 0.2);
  --text: #18122e;
  --muted: #57506e;
  --dim: #8a83a3;
  --violet: #7c3aed;
  --violet-deep: #5b21b6;
  --lilac: #6d28d9;
  --tint: 46, 16, 101;
  --bg-rgb: 247, 245, 252;
  --bg2-rgb: 239, 235, 248;
  --surface-rgb: 255, 255, 255;
  --contact-a: #ece4fd;
  --contact-b: #f7f5fc;
  --shadow: rgba(46, 16, 101, .18);
  --backdrop: rgba(24, 18, 46, .35);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(var(--tint),.06) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--lilac); }
main { position: relative; z-index: 1; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 8px; }

.eyebrow {
  font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* nav */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px clamp(20px, 5vw, 64px);
  transition: background .3s, border-color .3s, padding .3s;
  border-bottom: 1px solid transparent;
}
.nav--solid { background: rgba(var(--bg-rgb),.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-color: var(--line); padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
.brand em { font-size: 17px; }
.nav__links { display: flex; gap: 6px; align-items: center; }
.nav__links button { padding: 8px 14px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 500; transition: color .2s, background .2s; }
.nav__links button:hover { color: var(--text); background: rgba(var(--tint),.06); }
.nav__links .nav__cta { color: var(--text); border: 1px solid var(--line2); }
.nav__links .nav__cta:hover { border-color: var(--violet); background: rgba(139,92,246,.12); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px;
  font-weight: 600; font-size: 15px; transition: transform .2s, background .2s, border-color .2s, box-shadow .2s, opacity .2s;
}
.btn--primary { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; box-shadow: 0 10px 30px -10px rgba(139,92,246,.7); }
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(139,92,246,.9); }
.btn--ghost { border: 1px solid var(--line2); color: var(--text); }
.btn--ghost:hover { border-color: var(--lilac); background: rgba(var(--tint),.05); }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn--lg { padding: 18px 30px; font-size: 17px; }

/* hero */
.hero { position: relative; min-height: 100vh; padding: 140px clamp(20px, 5vw, 64px) 60px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.hero__glow {
  position: absolute; width: 900px; height: 900px; right: -200px; top: -200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,.28), rgba(91,33,182,.12) 40%, transparent 70%);
  filter: blur(20px); animation: drift 14s ease-in-out infinite alternate; pointer-events: none;
}
@keyframes drift { to { transform: translate(-120px, 80px) scale(1.1); } }
.hero__grid { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; max-width: 1280px; margin: 0 auto; width: 100%; }
.hero h1 { font-size: clamp(44px, 6.4vw, 92px); line-height: 1; letter-spacing: -.035em; font-weight: 700; margin: 22px 0 26px; }
.hero h1 em { font-size: 1.08em; letter-spacing: -.01em; }
.hero__lead { font-size: clamp(17px, 1.4vw, 20px); color: var(--muted); max-width: 560px; }
.hero__actions { display: flex; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
.hero__hint { position: relative; text-align: center; margin-top: 48px; font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: .08em; }
.stats { display: flex; gap: 44px; margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; }
.stat__v { font-family: var(--serif); font-size: 56px; line-height: 1; color: var(--text); }
.stat__l { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* orbit */
.orbit { position: relative; aspect-ratio: 1; width: 100%; max-width: 520px; margin: 0 auto; }
.orbit__ring { position: absolute; border-radius: 50%; border: 1px solid var(--line); }
.orbit__ring--1 { inset: 6%; }
.orbit__ring--2 { inset: 26%; border-style: dashed; border-color: rgba(var(--tint),.14); animation: spin 60s linear infinite reverse; }
.orbit__core {
  position: absolute; inset: 34%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle at 30% 30%, rgba(167,139,250,.35), rgba(91,33,182,.25) 55%, rgba(var(--surface-rgb),.9));
  border: 1px solid var(--line2); box-shadow: 0 0 80px rgba(139,92,246,.35), inset 0 0 40px rgba(var(--tint),.08);
  padding: 8px;
}
.orbit__num { font-family: var(--serif); font-size: clamp(48px, 6vw, 72px); line-height: 1; }
.orbit__lbl { font-size: 12px; color: var(--lilac); max-width: 120px; line-height: 1.3; margin-top: 4px; }
.orbit__spin { position: absolute; inset: 0; animation: spin 80s linear infinite; }
.orbit:hover .orbit__spin, .orbit:focus-within .orbit__spin, .orbit:hover .orbit__node span, .orbit:focus-within .orbit__node span { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
.orbit__node { position: absolute; transform: translate(-50%, -50%); }
.orbit__node span {
  display: block; white-space: nowrap; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: rgba(var(--surface-rgb),.85); border: 1px solid var(--line2); backdrop-filter: blur(8px);
  animation: spin 80s linear infinite reverse; transition: background .2s, border-color .2s, box-shadow .2s;
}
.orbit__node:hover span, .orbit__node:focus-visible span { background: var(--violet); border-color: var(--lilac); box-shadow: 0 0 30px rgba(139,92,246,.7); }

/* marquee */
.marquee { position: relative; z-index: 1; border-block: 1px solid var(--line); overflow: hidden; padding: 22px 0; background: rgba(var(--bg2-rgb),.6);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.marquee__track { display: flex; width: max-content; animation: marq 40s linear infinite; }
.marquee__track span { font-family: var(--serif); font-size: 30px; color: var(--muted); padding: 0 28px; white-space: nowrap; display: flex; align-items: center; gap: 56px; }
.marquee__track i { font-style: normal; color: var(--violet); font-size: 14px; }
.marquee:hover .marquee__track { animation-play-state: paused; }
@keyframes marq { to { transform: translateX(-50%); } }

/* sections */
.section { padding: 130px clamp(20px, 5vw, 64px) 40px; max-width: 1344px; margin: 0 auto; }
.section__head { max-width: 760px; margin-bottom: 48px; }
.section h2, .contact h2 { font-size: clamp(36px, 4.6vw, 64px); line-height: 1.04; letter-spacing: -.03em; font-weight: 700; margin: 16px 0 18px; }
.section__lead { color: var(--muted); font-size: 18px; max-width: 620px; }

/* toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--muted); transition: all .2s; }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip sup { font-family: var(--mono); font-size: 10px; opacity: .7; }
.chip:hover { color: var(--text); border-color: var(--line2); }
.chip--on { background: var(--text); color: var(--bg); border-color: var(--text); }
.search { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); min-width: 280px; transition: border-color .2s; }
.search:focus-within { border-color: var(--violet); }
.search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--dim); }
.search__x { font-size: 18px; line-height: 1; color: var(--muted); }
.activetech { display: inline-flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; margin-bottom: 18px; border-radius: 999px; background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.45); font-size: 14px; color: var(--lilac); }
.activetech strong { color: var(--text); }
.activetech button { width: 24px; height: 24px; border-radius: 50%; background: rgba(var(--tint),.12); font-size: 15px; line-height: 1; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 12px; }
.card {
  position: relative; display: flex; flex-direction: column; padding: 26px; border-radius: var(--r); cursor: pointer;
  background: linear-gradient(180deg, var(--surface), var(--bg2)); border: 1px solid var(--line); overflow: hidden;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s, opacity .6s, box-shadow .35s; min-height: 360px;
}
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%);
}
.card::after { content: ""; position: absolute; left: 26px; right: 26px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .5; }
.card:hover, .card:focus-visible { transform: translateY(-6px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 30px 60px -30px var(--shadow); }
.card:hover::before, .card:focus-visible::before { opacity: 1; }
.card > * { position: relative; }
.card__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.card__n { font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--dim); transition: color .3s; }
.card:hover .card__n { color: var(--accent); }
.card__area { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card__area i { width: 7px; height: 7px; border-radius: 50%; }
.card__client { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.card__title { font-size: 23px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; margin-bottom: 12px; }
.card__sum { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin-bottom: 18px; }
.card__hook { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--lilac); line-height: 1.3; margin-top: auto; margin-bottom: 20px; }
.card__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.card__arrow { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; transition: all .3s; }
.card:hover .card__arrow { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: rotate(45deg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(var(--tint),.06); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag--more { color: var(--dim); }
.tag--btn { transition: all .2s; }
.tag--btn:hover { border-color: var(--violet); color: var(--text); background: rgba(139,92,246,.18); }
.empty { padding: 60px; text-align: center; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); display: flex; flex-direction: column; gap: 18px; align-items: center; }

/* reveal */
[data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
[data-reveal].is-in { opacity: 1; transform: none; }
.card[data-reveal].is-in:hover { transform: translateY(-6px); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 100; background: var(--backdrop); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; justify-content: flex-end; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
.modal__panel {
  width: min(760px, 100%); height: 100%; overflow-y: auto; background: var(--bg2); border-left: 1px solid var(--line2);
  animation: slide .45s cubic-bezier(.2,.8,.2,1); outline: none; position: relative;
}
.modal__panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 320px; pointer-events: none; background: radial-gradient(600px 260px at 80% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
@keyframes slide { from { transform: translateX(60px); opacity: 0; } }
.modal__bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(var(--bg2-rgb),.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.modal__crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.modal__navs { display: flex; gap: 6px; }
.modal__navs button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line2); font-size: 16px; transition: all .2s; }
.modal__navs button:hover { background: var(--text); color: var(--bg); }
.modal__head { position: relative; padding: 40px 32px 28px; }
.modal__client { color: var(--accent); font-weight: 600; margin-top: 18px; }
.modal__head h2 { font-size: clamp(32px, 4vw, 48px); line-height: 1.05; letter-spacing: -.03em; margin: 6px 0 16px; }
.modal__sum { color: var(--muted); font-size: 17px; }
.modal__hook { margin-top: 22px; display: inline-block; padding: 10px 18px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--text); }
.tabs { position: sticky; top: 69px; z-index: 2; display: flex; gap: 4px; padding: 0 32px; border-bottom: 1px solid var(--line); background: var(--bg2); overflow-x: auto; }
.tab { padding: 14px 16px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; transition: color .2s, border-color .2s; }
.tab:hover { color: var(--text); }
.tab--on { color: var(--text); border-color: var(--accent); }
.tabbody { padding: 32px; animation: up .4s ease; min-height: 320px; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.big { font-size: 19px; line-height: 1.6; color: var(--text); }
.feats { display: grid; gap: 10px; margin-top: 28px; }
.feat { display: flex; gap: 18px; padding: 18px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); animation: up .45s ease both; }
.feat__i { font-family: var(--mono); font-size: 12px; color: var(--accent); padding-top: 3px; }
.feat h4 { font-size: 15.5px; margin-bottom: 3px; }
.feat p { font-size: 14px; color: var(--muted); }
.states { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 28px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.state { font-family: var(--mono); font-size: 10.5px; padding: 5px 9px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--lilac); }
.state__arr { color: var(--dim); font-size: 12px; }
.steps { position: relative; display: flex; justify-content: space-between; margin: 6px 0 26px; }
.steps__line { position: absolute; left: 18px; right: 18px; top: 50%; height: 2px; background: var(--line2); transform: translateY(-50%); z-index: 0; }
.steps__line div { height: 100%; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.stepdot { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; background: var(--bg2); border: 1.5px solid var(--line2); font-family: var(--mono); font-size: 13px; color: var(--muted); transition: all .3s; }
.stepdot--done { border-color: var(--accent); color: var(--accent); }
.stepdot--on { background: var(--accent); border-color: var(--accent); color: var(--bg); transform: scale(1.15); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent); }
.stepcard { padding: 28px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent), var(--surface)); animation: up .35s ease; min-height: 130px; }
.stepcard__k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.stepcard p { font-family: var(--serif); font-size: 28px; line-height: 1.2; margin-top: 10px; }
.stepctl { display: flex; justify-content: space-between; margin: 18px 0 28px; }
.stepctl .btn { padding: 10px 18px; font-size: 14px; }
.steplist { list-style: none; counter-reset: s; display: grid; gap: 2px; }
.steplist li { counter-increment: s; display: flex; gap: 14px; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; color: var(--muted); cursor: pointer; transition: all .2s; }
.steplist li::before { content: counter(s, decimal-leading-zero); font-family: var(--mono); font-size: 12px; color: var(--dim); padding-top: 2px; }
.steplist li:hover { background: rgba(var(--tint),.04); color: var(--text); }
.steplist li.on { color: var(--text); background: rgba(var(--tint),.06); }
.steplist li.on::before { color: var(--accent); }
.impact { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.impact__c { padding: 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); animation: up .45s ease both; position: relative; overflow: hidden; }
.impact__c::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.impact__c h4 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.15; margin-bottom: 8px; }
.impact__c p { color: var(--muted); font-size: 14.5px; }
.modal__stack { padding: 24px 32px 40px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }

/* matrix */
.matrix { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); padding: 10px 6px; overflow-x: auto; }
.matrix__row { display: grid; grid-template-columns: minmax(210px, 1.6fr) repeat(11, minmax(36px, 1fr)); align-items: center; padding: 6px 14px; border-radius: 10px; transition: background .2s, opacity .2s; min-width: 680px; }
.matrix__row.is-hot { background: rgba(139,92,246,.1); }
.matrix__row.is-dim { opacity: .45; }
.matrix__row--head { padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; border-radius: 0; }
.matrix__col { font-family: var(--mono); font-size: 12px; color: var(--muted); justify-self: center; padding: 4px 6px; border-radius: 6px; transition: all .2s; }
.matrix__col:hover { color: var(--text); background: rgba(var(--tint),.08); }
.matrix__tech { text-align: left; font-size: 14px; font-weight: 500; transition: color .2s; }
.matrix__tech sup { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-left: 4px; }
.matrix__tech:hover { color: var(--lilac); }
.dot { justify-self: center; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 15%, transparent); transition: transform .2s, box-shadow .2s; }
.dot:hover { transform: scale(1.4); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 25%, transparent), 0 0 18px var(--c); }
.dot--off { width: 4px; height: 4px; background: var(--line2); box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; }

/* approach */
.approach { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.approach__c { padding: 30px 26px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), transparent); position: relative; }
.approach__c:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 38px; color: var(--violet); z-index: 2; }
.approach__n { font-family: var(--serif); font-size: 48px; line-height: 1; color: var(--violet); }
.approach__c h3 { font-size: 21px; margin: 18px 0 8px; letter-spacing: -.01em; }
.approach__c p { color: var(--muted); font-size: 14.5px; }

/* contact */
.contact { position: relative; margin: 120px clamp(20px, 5vw, 64px) 0; padding: clamp(60px, 9vw, 120px) clamp(24px, 6vw, 80px); border-radius: 32px; border: 1px solid var(--line2); overflow: hidden; text-align: center; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(160deg, var(--contact-a), var(--contact-b) 70%); }
.contact__glow { position: absolute; width: 700px; height: 700px; left: 50%; top: -360px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,.45), transparent 65%); pointer-events: none; }
.contact > * { position: relative; }
.contact .section__lead { margin: 0 auto 36px; }

.socials { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.social { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); border: 1px solid var(--line2); border-radius: 999px; padding: 8px; transition: all .25s; }
.social__ic { width: 20px; height: 20px; display: grid; place-items: center; }
.social__ic svg { width: 100%; height: 100%; }
.social:hover { color: var(--text); border-color: var(--violet); background: rgba(139,92,246,.18); transform: translateY(-2px); }
.socials--big { gap: 14px; }
.socials--big .social { padding: 14px 22px 14px 16px; background: rgba(var(--surface-rgb),.6); color: var(--text); font-weight: 600; font-size: 15px; }
.socials--big .social__ic { width: 24px; height: 24px; color: var(--lilac); }
.socials--big .social:hover { box-shadow: 0 14px 34px -14px rgba(139,92,246,.8); }
.socials--big .social:hover .social__ic { color: #fff; }
.foot { position: relative; z-index: 1; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 40px clamp(20px, 5vw, 64px); color: var(--dim); font-size: 13px; }
.foot span { display: inline-flex; align-items: center; gap: 8px; }

/* responsive */
@media (max-width: 1080px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .approach { grid-template-columns: repeat(2, 1fr); }
  .approach__c::after { display: none; }
}
@media (max-width: 860px) {
  .hero__grid { grid-template-columns: 1fr; }
  .orbit { max-width: 420px; }
  .nav__links button:not(.nav__cta) { display: none; }
}
@media (max-width: 640px) {
  .grid, .approach, .impact { grid-template-columns: 1fr; }
  .search { min-width: 0; width: 100%; }
  .stats { gap: 28px; }
  .stat__v { font-size: 44px; }
  .orbit__node span { font-size: 11px; padding: 6px 10px; }
  .modal__head, .tabbody, .modal__stack { padding-left: 20px; padding-right: 20px; }
  .modal__bar, .tabs { padding-left: 20px; padding-right: 20px; }
  .stepcard p { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  [data-reveal] { opacity: 1; transform: none; }
}

/* about / cv */
.about { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
.about__photo { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid var(--line2); aspect-ratio: 4 / 5; }
.about__photo img { width: 100%; height: 100%; object-fit: cover; object-position: 42% center; filter: saturate(.75) contrast(1.05); transition: filter .6s, transform .8s; }
.about__photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(200deg, rgba(139,92,246,.35), transparent 45%, rgba(var(--bg-rgb),.75)); mix-blend-mode: normal; pointer-events: none; }
.about__photo:hover img { filter: saturate(1) contrast(1.05); transform: scale(1.03); }
.about__badge { position: absolute; left: 18px; bottom: 18px; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(var(--bg-rgb),.7); backdrop-filter: blur(8px); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; }
.about__dot { width: 8px; height: 8px; border-radius: 50%; background: #86efac; box-shadow: 0 0 10px #86efac; }
.about__role { font-family: var(--mono); font-size: 13px; color: var(--lilac); letter-spacing: .04em; margin: -4px 0 22px; }
.about__bio { color: var(--muted); font-size: 17px; margin-bottom: 14px; max-width: 640px; }
.about__meta { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line); }
.about__meta .tags { margin-top: 12px; }
.langs { list-style: none; margin-top: 12px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.langs strong { color: var(--text); margin-right: 4px; }
.cvgrid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-top: 64px; }
.sub { font-size: 22px; letter-spacing: -.01em; margin-bottom: 18px; }
.timeline, .certs { padding: 28px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), var(--bg2)); }
.tl { border-top: 1px solid var(--line); }
.tl__head { width: 100%; display: grid; grid-template-columns: 110px 1fr 28px; gap: 16px; align-items: center; text-align: left; padding: 16px 4px; }
.tl__date { font-family: var(--mono); font-size: 12px; color: var(--violet); }
.tl__main { display: flex; flex-direction: column; }
.tl__main strong { font-size: 16.5px; }
.tl__main span { font-size: 14px; color: var(--muted); }
.tl__plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 16px; color: var(--muted); transition: transform .3s, background .3s, color .3s; }
.tl--on .tl__plus { transform: rotate(45deg); background: var(--violet); color: #fff; border-color: var(--violet); }
.tl__head:hover .tl__main strong { color: var(--lilac); }
.tl__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1); }
.tl--on .tl__body { grid-template-rows: 1fr; }
.tl__body ul { overflow: hidden; list-style: none; padding-left: 126px; }
.tl--on .tl__body ul { padding-bottom: 18px; }
.tl__body li { position: relative; font-size: 14.5px; color: var(--muted); padding: 3px 0 3px 16px; }
.tl__body li::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 1px; background: var(--violet); }
.earlier { margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.earlier p { font-size: 14px; color: var(--muted); }
.earlier p span { font-family: var(--mono); font-size: 12px; color: var(--dim); display: inline-block; min-width: 92px; }
.earlier p strong { color: var(--text); font-weight: 600; }
.certs { display: flex; flex-direction: column; gap: 8px; }
.cert { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(var(--tint),.03); transition: border-color .2s, transform .2s; }
.cert:hover { border-color: var(--line2); transform: translateX(4px); }
.cert__iss { flex: none; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; min-width: 86px; text-align: center; }
.cert__iss--microsoft { background: rgba(125,211,252,.12); color: #7dd3fc; }
.cert__iss--anthropic { background: rgba(240,171,252,.12); color: #f0abfc; }
.cert__name { font-size: 14.5px; font-weight: 500; }
.func { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--line); }
.func p { margin-top: 10px; font-size: 14px; color: var(--muted); }
.modal__ctx { margin-top: 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
@media (max-width: 960px) {
  .about, .cvgrid { grid-template-columns: 1fr; }
  .about__photo { aspect-ratio: 4 / 3; }
  .about__meta { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .tl__head { grid-template-columns: 1fr 28px; }
  .tl__date { grid-column: 1 / -1; }
  .tl__body ul { padding-left: 4px; }
  .timeline, .certs { padding: 20px; }
}

/* mobile menu + touch refinements */
.burger { display: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); position: relative; z-index: 2; }
.burger span { position: absolute; left: 13px; right: 13px; height: 1.6px; background: var(--text); border-radius: 2px; transition: transform .3s, top .3s; }
.burger span:first-child { top: 17px; }
.burger span:last-child { top: 25px; }
.nav--open .burger span:first-child { top: 21px; transform: rotate(45deg); }
.nav--open .burger span:last-child { top: 21px; transform: rotate(-45deg); }
.mmenu { display: none; }
.swipehint { display: none; font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: center; margin-top: 10px; letter-spacing: .08em; }
.matrix { -webkit-overflow-scrolling: touch; }
@media (max-width: 860px) {
  .nav__links { display: none; }
  .burger { display: block; }
  .mmenu { display: flex; position: fixed; left: 0; right: 0; top: 0; height: 100dvh; z-index: 1; flex-direction: column; justify-content: center; gap: 6px; padding: 90px 28px 40px;
    background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav--open .mmenu { opacity: 1; pointer-events: auto; }
  .mmenu > button:not(.btn) { display: flex; align-items: baseline; gap: 16px; text-align: left; font-size: 40px; font-weight: 700; letter-spacing: -.03em; padding: 8px 0; border-bottom: 1px solid var(--line);
    opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; }
  .mmenu > button span { font-family: var(--mono); font-size: 12px; color: var(--violet); font-weight: 400; letter-spacing: .1em; }
  .nav--open .mmenu > button:not(.btn) { opacity: 1; transform: none; }
  .mmenu .btn { margin-top: 28px; align-self: flex-start; }
  .swipehint { display: block; }
  .brand { position: relative; z-index: 2; }
}
@media (max-width: 640px) {
  .hero { padding-top: 110px; min-height: auto; }
  .section { padding-top: 90px; }
  .tabs { padding: 0 12px; gap: 0; }
  .tab { padding: 14px 10px; font-size: 13.5px; }
  .modal__panel { border-left: 0; }
  .card { min-height: 0; padding: 22px; }
  .contact { margin-top: 80px; border-radius: 24px; }
  .socials--big .social { padding: 12px 18px 12px 14px; }
  .foot { flex-direction: column; align-items: center; text-align: center; }
  .stats { justify-content: space-between; }
}
@media (hover: none) {
  .card:hover { transform: none; }
  .card:active { transform: scale(.985); }
}

/* logo */
.brand__logo { height: 46px; width: auto; display: block; transition: height .3s, opacity .2s; }
.nav--solid .brand__logo { height: 40px; }
.brand:hover .brand__logo { opacity: .85; }
.foot__logo { height: 36px; width: auto; display: block; opacity: .75; }
@media (max-width: 640px) { .brand__logo, .nav--solid .brand__logo { height: 38px; } }

/* ---- theme transition ---- */
body { transition: background-color .35s ease, color .35s ease; }

/* ---- toggles ---- */
.toggles { display: inline-flex; align-items: center; gap: 8px; margin: 0 6px; }
.langsw { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line2); }
.langsw button { padding: 4px 10px !important; border-radius: 999px; font-size: 12px !important; font-weight: 700 !important; letter-spacing: .06em; color: var(--muted); background: none !important; }
.langsw button.on { background: var(--text) !important; color: var(--bg) !important; }
.themesw { width: 36px; height: 36px; padding: 0 !important; border-radius: 50%; border: 1px solid var(--line2); display: inline-grid; place-items: center; color: var(--text) !important; transition: transform .4s, border-color .2s; }
.themesw:hover { transform: rotate(25deg); border-color: var(--violet); }
.nav__mtoggles { display: none; margin-left: auto; margin-right: 10px; position: relative; z-index: 2; }
@media (max-width: 860px) { .nav__mtoggles { display: block; } .nav__mtoggles .toggles { margin: 0; } }
@media (max-width: 380px) { .langsw button { padding: 4px 8px !important; } }

/* ---- light theme fixes ---- */
:root[data-theme="light"] body::before { opacity: .6; }
:root[data-theme="light"] .hero__glow { background: radial-gradient(circle, rgba(139,92,246,.22), rgba(167,139,250,.1) 40%, transparent 70%); }
:root[data-theme="light"] .orbit__core { background: radial-gradient(circle at 30% 30%, #ffffff, #ede7fb 60%, #e2d8fb); box-shadow: 0 0 80px rgba(139,92,246,.22), inset 0 0 30px rgba(255,255,255,.8); }
:root[data-theme="light"] .orbit__node span { background: rgba(255,255,255,.9); }
:root[data-theme="light"] .orbit__node:hover span, :root[data-theme="light"] .orbit__node:focus-visible span { color: #fff; }
:root[data-theme="light"] .card { background: linear-gradient(180deg, #ffffff, #faf8ff); box-shadow: 0 1px 2px rgba(46,16,101,.06); }
:root[data-theme="light"] .card__hook, :root[data-theme="light"] .about__role { color: var(--lilac); }
:root[data-theme="light"] .card:hover .card__arrow { color: #fff; }
:root[data-theme="light"] .marquee { background: rgba(255,255,255,.6); }
:root[data-theme="light"] .stepdot--on, :root[data-theme="light"] .tl--on .tl__plus { color: #fff; }
:root[data-theme="light"] .about__badge { background: rgba(255,255,255,.85); }
:root[data-theme="light"] .about__photo::after { background: linear-gradient(200deg, rgba(139,92,246,.22), transparent 45%, rgba(24,18,46,.35)); }
:root[data-theme="light"] .contact__glow { background: radial-gradient(circle, rgba(139,92,246,.25), transparent 65%); }
:root[data-theme="light"] .socials--big .social { background: rgba(255,255,255,.75); }
:root[data-theme="light"] .socials--big .social:hover .social__ic { color: var(--violet); }
:root[data-theme="light"] .state { color: var(--violet-deep); }
:root[data-theme="light"] .modal__panel { background: #fbfaff; }
:root[data-theme="light"] .modal__bar { background: rgba(251,250,255,.9); }
:root[data-theme="light"] .tabs { background: #fbfaff; }
:root[data-theme="light"] .feat, :root[data-theme="light"] .impact__c { background: #fff; }
:root[data-theme="light"] .cert__iss--microsoft { background: rgba(3,105,161,.1); color: #0369a1; }
:root[data-theme="light"] .cert__iss--anthropic { background: rgba(162,28,175,.1); color: #a21caf; }
:root[data-theme="light"] .about__dot { background: #16a34a; box-shadow: none; }

/* certificazioni raggruppate per ente */
.certgrp { padding: 14px 4px; border-top: 1px solid var(--line); }
.certgrp:first-of-type { border-top: 0; padding-top: 4px; }
.certgrp__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.certgrp__n { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.certgrp ul { list-style: none; display: grid; gap: 2px; }
.certgrp li { position: relative; font-size: 14.5px; font-weight: 500; padding: 4px 0 4px 16px; transition: transform .2s, color .2s; }
.certgrp li::before { content: ""; position: absolute; left: 0; top: 13px; width: 6px; height: 1px; background: var(--violet); }
.certgrp li:hover { transform: translateX(3px); color: var(--lilac); }
.cert__iss--pragmaticworks { background: rgba(252,211,77,.12); color: #fcd34d; }
.cert__iss--sqlbi { background: rgba(134,239,172,.12); color: #86efac; }
.cert__iss--udemy { background: rgba(167,139,250,.14); color: #c4b5fd; }
:root[data-theme="light"] .cert__iss--pragmaticworks { background: rgba(180,83,9,.1); color: #b45309; }
:root[data-theme="light"] .cert__iss--sqlbi { background: rgba(21,128,61,.1); color: #15803d; }
:root[data-theme="light"] .cert__iss--udemy { background: rgba(124,58,237,.1); color: #6d28d9; }
.cert__iss { min-width: 0; }

/* link al blog (versione pubblicata sul sito) */
.nav__links .nav__blog { padding: 8px 14px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 500; transition: color .2s, background .2s; }
.nav__links .nav__blog:hover { color: var(--text); background: rgba(var(--tint), .06); }
.mmenu__blog { display: flex; align-items: baseline; gap: 16px; font-size: 40px; font-weight: 700; letter-spacing: -.03em; padding: 8px 0; border-bottom: 1px solid var(--line); opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; }
.mmenu__blog span { font-family: var(--mono); font-size: 12px; color: var(--violet); font-weight: 400; }
.nav--open .mmenu__blog { opacity: 1; transform: none; }

specific fixed-width format for import into Zucchetti.",solution:"A chain of automations picks up the file from the network share every evening, reshapes it in Power BI (with an R script) and imports it into Shifts through an RPA flow. A button inside the Power BI report generates the Zucchetti export on demand and sends it by email.",features:[["Scheduled nightly import","At 8:30 pm the time-clock file is picked up, cleaned and loaded into Shifts."],["Anomaly alerts","Inconsistent punches or missing user data trigger an alert email."],["On-demand export","A button in the Power BI report produces the fixed-width file for Zucchetti."],["Master data on SharePoint","Dedicated lists for users and reason codes, used to tell overtime types apart."]],flow:["The time clock drops its file on a network share","Power BI processes the file in a scheduled refresh","The ready file is saved to OneDrive","A Power Automate Desktop flow imports it into Shifts","On request, the report generates the Zucchetti export","The fixed-width file reaches the internal team by email"],impact:[["No manual entry","Shifts go from the time clock to Teams without retyping."],["Payroll integration","The export follows the format Zucchetti requires."],["Anomalies caught early","Errors show up by email straight away, not at month end."]]},"dg-desk-booking":{title:"Desk Booking App",hook:"Book a desk in a few seconds",summary:"An app for managing shared desks in a hybrid office: floor maps, instant confirmation, and cancellations that free the desk right away.",challenge:"With hybrid work, the company needed a way to manage shared desks across its offices: use space better, cut no-shows and support the return to the office without manual tracking.",solution:"A three-screen Power Apps canvas app inside Microsoft 365, with SharePoint lists for desks and bookings and Power Automate flows for notifications. Releases move from a test environment to production.",features:[["Interactive floor maps","Pick floor and date and see free and taken desks at a glance."],["Instant confirmation","Saving a booking sends an automatic confirmation email."],["My bookings","Calendar view with desk number and location."],["Instant cancellation","Cancelling frees the desk for colleagues immediately."],["Wave 2","Full booking view, advanced filters, and weekly and monthly summary emails."]],flow:["The user opens the app on the Home screen","Picks floor and date and sees the available desks","Confirms: the booking is saved to SharePoint","Power Automate sends the confirmation email","From \u201CMy bookings\u201D they can review or cancel"],impact:[["Better use of space","Office occupancy that fits the hybrid model."],["Fewer no-shows","Automatic confirmations and reminders reduce empty desks."],["Governance","Centralised data and separate test and production environments."]]},"dg-portale-bp":{title:"Business Partner Portal",hook:"Customer onboarding with multi-level approval",summary:"A secure portal where customers fill in their own master data, business units enrich and approve it, and the record comes out ready for SAP.",challenge:"Business Partner onboarding ran on Excel and email, with a separate hierarchy file of about 30-35 fields, manual entry into SAP and no traceability.",solution:"A Power Pages portal with \u201CNew customer\u201D and \u201CEdit customer\u201D forms, reached through a signed link with an expiry date. SharePoint acts as database and workflow engine; Power Automate handles states, notifications and the export to SAP.",features:[["Guided digital form","External customers fill in their master data through a secure link."],["Unique token links","Each request has a signed token with step and expiry, no credentials needed."],["Multiple addresses and attachments","Several Ship-To addresses and documents per request."],["Multi-level approval","Approve, ask for more information or reject, with automatic notifications."],["Ready for SAP and Anaplan","Master data export for SAP and Sold-to data for Pricing."]],flow:["Sales starts the request and sends the link to the customer","The customer fills in master data, addresses and attachments","The request is saved and the relevant BU is notified","Business Analysis, Credit and Customer Service enrich and approve","Customer Service confirms: status CONFIRMED","The data is exported to SAP and Anaplan"],impact:[["Digital onboarding","One standard process that involves every BU."],["Fewer errors, less time","No more Excel-and-email loop."],["Full audit trail","A single record with states, approvers and attachments."],["Secure external access","No credentials: a signed link with an expiry date."]]},"earth-energy-datacopy":{title:"Data Copy Dataverse \u2192 Business Central",hook:"3 flows, 4 target environments",summary:"An integration that moves customers and invoices from Dataverse to the ERP, with a selectable target environment for testing and go-live.",challenge:"Customer master data and billing data lived in Dataverse tables but had to reach Business Central for accounting. The transfer was done by hand.",solution:"Three Power Automate \u201CCopy Data\u201D flows (customers, invoice headers and invoice lines) read from production Dataverse and write to Business Central through a custom API, with a selectable target environment.",features:[["Customer copy","Customer data moves to the ERP automatically."],["Multiple invoice headers","Handles multiple records with the required tax fields."],["Invoice lines","Lines follow their document headers."],["Selectable environment","The same logic writes to DEV, TEST, TEST-FE or PROD."],["Targeted tests","An OData filter isolates a single invoice for testing."]],flow:["The flow starts on a schedule","Reads rows from production Dataverse","Loops over each record","Creates the matching record in Business Central","Short technical pause between writes","Cleans up the processed record"],impact:[["Automatic transfer","No manual copying, fewer errors."],["Aligned data","Customers and invoices match between Dataverse and the ERP."],["Simple go-live","From testing to production by changing one parameter."],["Maintainable","Separate flows with clear responsibilities."]]},"frm-powerbi":{title:"Power BI analysis reports",hook:"From SSRS to Power BI, with security per partner",summary:"SSRS reports rebuilt in Power BI to match the originals, plus two new billing reports and access limited by responsible partner.",challenge:"Reports ran on SQL Server Reporting Services: pick some filters, click \u201CView Report\u201D, and little else. The goal was modern analysis that wouldn't disorient users, with data protected per partner.",solution:"Power BI reports connected to the client's SQL database and published in a dedicated workspace, with Excel export of every visual and Row Level Security managed through Microsoft 365 security groups.",features:[["SSRS rebuild","Each report rebuilt in Power BI as close as possible to the original."],["Excel export of visuals","Every visual can be exported, as the client required."],["Invoice Tracker","A new billing report."],["Invoice Summary","A second new report, with its table already prepared."],["RLS per responsible partner","Each partner sees only their own data."]],flow:["Connect to the client environment via Azure VPN","Link Power BI Desktop to the SQL database","Identify the source tables for each report","Rebuild the visuals to match the original","Define the RLS rules in Desktop","Assign users and groups in Power BI Service"],impact:[["Interactive analysis","From static reports to visuals with filters."],["Continuity","Familiar layouts, an easy switch for users."],["Protected data","Visibility by responsible partner."],["Managed access","Permissions handled through Microsoft 365 groups."]]},"cubico-cubibudget":{title:"CubiBudget \xB7 Actual & Forecast",hook:"Period freeze: one official number",summary:"Budget, actuals and forecast for the portfolio in one governed app, with inline editing and freezing of official periods.",challenge:"A portfolio of complex assets tracked in a shared folder of Excel files: hours of consolidation every week, overwritten cells, no official snapshot.",solution:"A Power Apps app on Dataverse that puts approved plan, actuals and forecast side by side, with calculated deltas, dynamic filters and Power Automate workflows for notifications, approvals and bulk imports.",features:[["Three-area dashboard","Budget summary, monthly detail by category and KPI cards."],["Dynamic filters","Categories, projects, months and years update the whole view."],["Collapsible percentage table","Detailed KPIs per project without cluttering the main view."],["Inline editing","Edit values in a popup with immediate validation."],["Freeze / unfreeze","Validated numbers become the official version and can no longer be changed."]],flow:["The user sets category, project, month and year","The dashboard compares plan, actuals and forecast","Monthly detail shows the trend by category","The collapsible KPI table gives the deeper view","Every change recalculates totals and cards in real time","The validated period is frozen"],impact:[["Hours saved","No more manual consolidation of Excel files."],["Official data","A single portfolio snapshot for management."],["Fewer errors","Role-based permissions, no accidental overwrites."],["Faster decisions","Management always has the portfolio summary at hand."]]},"ikea-ai-kea":{title:"AI-Kea \xB7 Assistant for P&C Services Tool",hook:"Answers only from the official knowledge base",summary:"A conversational agent that helps co-workers use the HR tool, answering only from the official guide.",challenge:"Co-workers use the P&C Services Tool for sick leave, permits, parental leave, benefits and personal data changes. They needed fast, reliable help that would take load off the usual support channels.",solution:"AI-Kea, a Copilot Studio agent based on GPT-5 Chat with a knowledge base limited to the tool's official guide, published on Microsoft Teams and Microsoft 365 Copilot.",features:[["Sickness and injury","Help with submitting the paperwork."],["Permits","Medical visits, bereavement, study, elections and other cases."],["Leave","Maternity, paternity and Law 104 leave."],["Data changes and badges","IBAN, address, training and badge replacement."],["Advances, severance and benefits","Salary advances, TFR, mobility bonus and company vouchers."]],flow:["Analysis of the infrastructure and data sources","Checking connections to the data sources","Designing the agent architecture","Configuring connections and features","Development, testing and debugging","Publishing on Teams and Microsoft 365 Copilot"],impact:[["Instant answers","Frequent questions no longer go through HR."],["Consistent information","Always aligned with the official documentation."],["Lighter HR workload","Co-workers handle more on their own."],["Multichannel","Available in Teams and Microsoft 365 Copilot."]]},"resin-platform":{title:"Document and job-site platform",hook:"10\u201315 paper reports a day eliminated",summary:"Four incremental waves that digitise documents, HR and job sites, with Business Central as the source of truth.",challenge:"Customer and job documents sat in unstructured folders; leave requests, site reports and messages to team leaders went through WhatsApp, paper and Excel. Cutting sites alone produced 10\u201315 paper reports a day.",solution:"A Power Platform solution integrated with Business Central: automatic SharePoint sites for customers and jobs, leave requests with Forms and approvals, an app for team leaders and automatic email filing.",features:[["Customer site provisioning","New customer in BC \u2192 SharePoint site with permissions and home page ready."],["Digital leave requests","Forms and an approval workflow with notifications in Teams and Outlook."],["Team leader app","Daily dispatch of sites and tasks with read confirmation."],["End-of-job reports","Two forms (Cutting and Resin) saved to dedicated lists."],["Email filing","Emails and attachments archived automatically, shared mailboxes included."]],flow:["New customer in Business Central \u2192 dedicated SharePoint site","New job \u2192 document library with a Safety folder","An employee requests leave through Forms","Power Automate logs it and notifies the approvers","Approval from Teams/Outlook updates the request","Team leaders receive the schedule in the app"],impact:[["Documents in one place","A hub site for customers and jobs, searchable."],["Faster HR","Leave handled with workflows and notifications."],["Digital job sites","Paper reports replaced by integrated forms."],["Clear communication","From WhatsApp chats to a tracked flow."]]},"flos-copilot":{title:"Multilingual Copilot Chat course",hook:"3 videos \xB7 3 languages \xB7 9 departments",summary:"A practical video course on Copilot 365, built on each department's use cases and localised into three languages with AI lip sync.",challenge:"Train nine departments, from Front Office to Finance, to use Copilot 365 in practice, with attention to responsible data use and use cases specific to each one.",solution:"Three videos of about 60 minutes each, scripted over several iterations, with slides in the client's brand and ready-to-use prompts per department. Recorded in Italian and localised with AI into English and Spanish, keeping lip sync.",features:[["Prompt design basics","5 golden rules, 4 pillars and the structure of the \u201Cperfect prompt\u201D."],["Searching company information","Summaries of documents from SharePoint, OneDrive and Teams."],["Day-to-day support","Checklists, FAQs, onboarding and standard templates."],["Translations","Texts translated while keeping tone and register."],["Calls and meetings","Agendas, transcript summaries and action items."]],flow:["Video 1: introduction to AI and prompt design","Video 2: Front Office, Sales, Marketing and Legal","Video 3: R&D, Product, IT, HR and Finance","Each video ends with an exercise and a good-prompt checklist","Recording in Italian","Lip-sync localisation into English and Spanish"],impact:[["Immediate adoption","Ready prompts built on each department's scenarios."],["Time saved","Less time spent searching, summarising and drafting."],["Data kept safe","Copilot works inside the company's Microsoft 365 tenant."],["Multilingual at scale","One production, three languages."]]},niles:{title:"Niles \xB7 the digital butler",hook:"Agent, licensing system and mobile app",context:"Cloudia Research \xB7 with Edoardo Massa",summary:"An AI agent that turns natural-language requests into actions on Microsoft 365, designed to be installed at client sites with its own licences.",challenge:"Work is scattered across Outlook, Teams, Calendar and SharePoint, with constant context switching. The goal was also an installable product, with access governed by licences separate from Microsoft's.",solution:"Niles, a Copilot Studio agent connected to Microsoft 365 through Graph, Power Automate and Azure Functions. Around the agent: a JWT-based licensing system and a .NET MAUI mobile app with chat, voice and attachments.",features:[["Email","Reads, organises, summarises and drafts; sends only after confirmation."],["Calendar","Finds free slots, colleagues' too, and creates Teams meetings."],["Teams","Handles chats and messages for teamwork."],["Reports and data","Retrieves company data and generates files and dashboards on SharePoint."],["Proprietary licensing","Every action checks for a valid JWT licence."],["Mobile and voice","App with history, attachments, voice notes and text-to-speech replies."]],flow:["Natural-language request, by chat or voice","Licence check through the API and JWT","Intent recognition","Orchestration of Graph, Power Automate and Azure Functions","Data retrieval or action","Structured answer or action confirmation"],impact:[["Time freed up","Email and scheduling handled by the agent."],["Less mental load","Information from several sources in one answer."],["Native to Microsoft 365","Works on real data, no extra tools."],["Ready to distribute","Licensing and least privilege to scale across clients."]]},"btp-night-scout":{title:"Night Scout \xB7 overnight newsroom",hook:"8 RSS feeds \u2192 up to 3 proposals every morning",context:"Beyond The Platforms \xB7 personal project",summary:"An editorial assistant that reads industry news overnight and proposes drafts per channel in the morning, always approved by the author.",challenge:"News arrives every day from Microsoft, OpenAI, Anthropic and technical communities. The goal was to turn it into editorial proposals that fit the brand, without losing human control.",solution:"Three scheduled flows linked through SharePoint (Collector, Curator, Delivery) and two AI Builder prompts. In the morning each proposal arrives in Teams as an Adaptive Card: approve, refine or discard.",features:[["Multi-source collection","8 RSS feeds filtered to the last 24 hours."],["Brand-aware curation","Drops generic ideas and avoids semantic duplicates."],["Drafts per channel","LinkedIn, Instagram, YouTube Shorts, Substack and website, each with its own format."],["Image prompts","One prompt per channel, ready to reuse."],["Human in the loop","Nothing is archived without approval, nothing is published automatically."]],flow:["2 am: the Collector reads the 8 feeds and saves the raw data","4 am: the Curator generates proposals with AI","Curated proposals are saved to SharePoint","7 am: each proposal arrives in Teams as a card","Approve or refine: the AI regenerates that single channel","Approved content is archived by channel"],impact:[["Mornings for decisions","Collection and first drafts happen overnight."],["Brand consistency","Tone and selection rules are written into the prompt."],["Human control","The author approves every piece."],["Tidy archive","Files by day, proposal and channel, ready to reuse."]]}},qc=[["Listen","Analysis of the current process with the clien
