title: "Beyond The Platforms"
tagline: "AI agents, Copilot Studio and the Power Platform, from the field"
description: "AI, Copilot Studio, Microsoft Fabric and Power Platform insights."
url: "https://beyondtheplatforms.github.io"
baseurl: ""
lang: "en-US"
locale: "en_US"
timezone: "Europe/Rome"
newsletter_url: "https://paoloasnaghi.substack.com"

author:
  name: "Paolo Asnaghi"
  url: "https://www.linkedin.com/in/paoloasnaghi/"

# Default image used when a page is shared on LinkedIn or other social networks
logo: "/assets/images/brand/icon-512.png"
social:
  name: "Paolo Asnaghi"
  links:
    - "https://www.linkedin.com/in/paoloasnaghi/"
    - "https://www.youtube.com/@BeyondThePlatforms"
    - "https://substack.com/@paoloasnaghi"
    - "https://www.instagram.com/beyond_the_platforms/"
    - "https://github.com/beyondtheplatforms"

permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

# Every file in _posts uses the post layout, so new articles don't need to declare it
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Paolo Asnaghi"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .vscode/
  - .github/
