<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply the saved theme before the page paints (shared with /portfolio/)
  (function () {
    var t = "dark";
    try { var s = localStorage.getItem("btp-theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.add("js");
  })();
</script>
