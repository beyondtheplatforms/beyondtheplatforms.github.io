<div class="socials{% if include.big %} socials--big{% endif %}">
  {%- for s in site.data.social %}
  <a class="social" href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.name }}" title="{{ s.name }}">
    <span class="social__ic">{% include icon.html name=s.icon %}</span>
    {%- if include.big %}<span class="social__lbl">{{ s.name }}</span><span class="social__arr" aria-hidden="true">↗</span>{% endif %}
  </a>
  {%- endfor %}
</div>
